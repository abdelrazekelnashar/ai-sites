<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bookmark Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* PASTE YOUR style.css CONTENT HERE */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #f8f9fa;
        }
        .dashboard {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .glass-panel {
            background: #ffffff;
        }
        .category-list {
            list-style: none;
            padding: 0;
        }
        .category-list li {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        .category-list li.active {
            background: #e2e8f0;
            font-weight: 600;
        }
        .btn {
            padding: 8px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Main Dashboard -->
    <div id="dashboard" class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <h2>AI Categories</h2>
            <ul id="category-list" class="category-list">
                <li class="active" data-category="All">All</li>
                <!-- Categories injected via JS -->
            </ul>
            <div class="sidebar-actions">
                <button id="export-btn" class="btn secondary-btn">Export Backup</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header glass-panel">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search AI tools...">
                </div>
            </header>

            <div id="bookmarks-grid" class="bookmarks-grid">
                <!-- Bookmark Cards injected via JS -->
            </div>
        </main>
    </div>

    <script>
        // PASTE YOUR app.js CONTENT HERE
        console.log("App script loaded inline.");
    </script>
</body>
</html>
